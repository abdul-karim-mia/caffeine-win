name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Release Executable
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Add target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Setup MSVC dev cmd (ARM64 linker)
        if: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Determine Release Tag & Version
        id: versioning
        shell: pwsh
        run: |
          # 1. If triggered by a Git tag, use it directly
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
            Write-Host "Triggered by tag: $tag"
            echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
            echo "RELEASE_VERSION=$tag" >> $env:GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $env:GITHUB_ENV
            echo "RELEASE_NAME=Caffeine for Windows $tag" >> $env:GITHUB_ENV
            exit 0
          }

          # 2. Extract version from Cargo.toml
          $cargoContent = Get-Content Cargo.toml -Raw
          if ($cargoContent -match 'version\s*=\s*"([^"]+)"') {
            $cargoVer = $matches[1]
          } else {
            $cargoVer = "0.1.0"
          }

          $targetTag = "v$cargoVer"
          Write-Host "Cargo.toml version: $cargoVer (tag: $targetTag)"

          # 3. Check if this tag already exists on remote
          $existingTag = git ls-remote --tags origin "refs/tags/$targetTag"
          if (-not $existingTag) {
            Write-Host "New version detected ($targetTag). Publishing official release."
            echo "RELEASE_TAG=$targetTag" >> $env:GITHUB_ENV
            echo "RELEASE_VERSION=$cargoVer" >> $env:GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $env:GITHUB_ENV
            echo "RELEASE_NAME=Caffeine for Windows $targetTag" >> $env:GITHUB_ENV
          } else {
            Write-Host "Tag $targetTag already exists. Updating rolling 'latest' release."
            echo "RELEASE_TAG=latest" >> $env:GITHUB_ENV
            echo "RELEASE_VERSION=$cargoVer" >> $env:GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $env:GITHUB_ENV
            echo "RELEASE_NAME=Caffeine for Windows (Latest Build)" >> $env:GITHUB_ENV
          }

      - name: Run Unit Tests (x64)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        run: cargo test --release --target ${{ matrix.target }}

      - name: Run Unit Tests (ARM64, compile only)
        if: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
        run: cargo check --target ${{ matrix.target }}

      - name: Build Optimized Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Pack MSIX for Microsoft Store (x64, ARM64)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") { "x64" } else { "arm64" }
          powershell -ExecutionPolicy Bypass -File tools\pack-msix.ps1 -Arch $arch

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'installer.iss' || 'installer.arm64.iss' }}

      - name: Normalize installer name per arch
        shell: pwsh
        run: |
          # installer.iss writes caffeine-win-setup.exe; keep a per-arch name so the
          # x64 and ARM64 installers never collide in the release assets.
          if (Test-Path dist\caffeine-win-setup.exe) {
            $arch = if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") { "x64" } else { "arm64" }
            Move-Item -Force dist\caffeine-win-setup.exe "dist\caffeine-win-setup-$arch.exe"
          }

      - name: Upload MSIX as run artifact (Store submission only)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-pc-windows-msvc' }}
        uses: actions/upload-artifact@v4
        with:
          name: caffeine-win-${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x64' || 'arm64' }}-msix
          path: dist/caffeine-win-*.msix
          if-no-files-found: warn

      - name: Package Release Assets & Compute Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist

          $arch = if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") { "x64" } else { "arm64" }
          $srcExe = "target\${{ matrix.target }}\release\caffeine-win.exe"
          Write-Output "arch=$arch srcExe=$srcExe exists=$(Test-Path $srcExe)"

          # Copy portable artifact
          $exeName = if ($arch -eq "x64") { "caffeine-win.exe" } else { "caffeine-win-arm64.exe" }
          Copy-Item $srcExe -Destination "dist\$exeName"
          Copy-Item README.md -Destination dist\README.md
          Copy-Item LICENSE -Destination dist\LICENSE.txt

          # Create Zip distribution: the portable exe, README and LICENSE only.
          # dist also holds the per-arch setup installer and the Store MSIX;
          # neither belongs inside this archive.
          $zipName = "caffeine-win-windows-$arch.zip"
          Compress-Archive -Path "dist\$exeName","dist\README.md","dist\LICENSE.txt" -DestinationPath "dist\$zipName"

          # Compute SHA-256 hashes
          $exeHash = (Get-FileHash -Path "dist\$exeName" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash -Path "dist\$zipName" -Algorithm SHA256).Hash
          "$exeHash  $exeName" | Out-File -Encoding ascii "dist\$exeName.sha256"
          "$zipHash  $zipName" | Out-File -Encoding ascii "dist\$zipName.sha256"
          # SHA-256 for the per-arch setup installer too.
          $setupName = "caffeine-win-setup-$arch.exe"
          if (Test-Path "dist\$setupName") {
            $setupHash = (Get-FileHash -Path "dist\$setupName" -Algorithm SHA256).Hash
            "$setupHash  $setupName" | Out-File -Encoding ascii "dist\$setupName.sha256"
          }

          Write-Output "Assets packaged successfully for $arch"
          Get-ChildItem dist | Select-Object Name, Length

      - name: Generate Release Notes
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $tags = git for-each-ref "refs/tags/v*" --sort=-v:refname --format="%(refname:short)"
          $prev = $null
          $end = "HEAD"
          if ($tag -like "v*" -and $tag -ne "latest") {
            $end = $tag
            try {
              $prev = ($tags | Where-Object { [version]$_.TrimStart("v") -lt [version]$tag.TrimStart("v") } | Select-Object -First 1)
            } catch {
              $prev = $tags | Select-Object -First 1
            }
          } else {
            $prev = $tags | Select-Object -First 1
          }
          $range = if ($prev) { "$prev..$end" } else { $end }
          Write-Host "Commits in range: $range"
          $commits = git log $range --no-merges --pretty=format:"- %h %s"
          $body = "## What's Changed`n`n" + ($commits -join "`n")
          Set-Content -Path RELEASE_NOTES.md -Value $body -Encoding utf8
          Write-Host "--- RELEASE_NOTES.md ---"
          Get-Content RELEASE_NOTES.md

      - name: Publish GitHub Release (x64)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/caffeine-win.exe
            dist/caffeine-win.exe.sha256
            dist/caffeine-win-windows-x64.zip
            dist/caffeine-win-windows-x64.zip.sha256
            dist/caffeine-win-setup-x64.exe
            dist/caffeine-win-setup-x64.exe.sha256
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          draft: false
          generate_release_notes: true
          make_latest: true
          overwrite_files: true

      - name: Publish GitHub Release (ARM64)
        if: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/caffeine-win-arm64.exe
            dist/caffeine-win-arm64.exe.sha256
            dist/caffeine-win-windows-arm64.zip
            dist/caffeine-win-windows-arm64.zip.sha256
            dist/caffeine-win-setup-arm64.exe
            dist/caffeine-win-setup-arm64.exe.sha256
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          draft: false
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
