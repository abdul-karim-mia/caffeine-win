name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Verify release executable
        shell: pwsh
        run: |
          $exe = "target\release\caffeine-win.exe"
          if (Test-Path $exe) {
            $size = (Get-Item $exe).Length
            Write-Host "Success! Executable size: $size bytes"
          } else {
            Write-Error "Release executable not found!"
            exit 1
          }

      - name: Install Inno Setup
        uses: InnoIDE/install-inno-setup@v2

      - name: Verify installer build
        shell: pwsh
        run: |
          # Update version in installer script for CI validation
          $installerContent = Get-Content installer.iss -Raw
          $version = "ci-validate"
          $installerContent = $installerContent -replace 'MyAppVersion = "[^"]*"', "MyAppVersion = `"$version`""
          Set-Content -Path installer.iss -Value $installerContent

          $innoPath = [Environment]::GetFolderPath("ProgramFiles") + "\Inno Setup 2024\ISCC.exe"
          if (-not (Test-Path $innoPath)) {
              $innoPath = [Environment]::GetFolderPath("ProgramFiles") + "\Inno Setup\IscsI3.exe"
          }
          if (Test-Path $innoPath) {
              & $innoPath installer.iss /SP- /VERYSILENT
          } else {
              Write-Error "Inno Setup compiler not found"
              exit 1
          }
