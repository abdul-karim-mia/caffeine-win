[package]
name = "caffeine-win"
version = "0.1.0"
edition = "2024"
authors = ["Abdul <opensource>"]
license = "MIT"
description = "Lightweight Windows 11 system tray Caffeine keep-awake app"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
] }

[build-dependencies]
winresource = "0.1"
