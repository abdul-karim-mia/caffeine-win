[package]
name = "caffeine-win"
version = "0.2.0"
edition = "2024"
authors = ["Abdul Karim Mia"]
license = "MIT"
description = "Lightweight Windows 11 system tray keep-awake utility with animated circular timer"
readme = "README.md"
repository = "https://github.com/abdul-karim-mia/caffeine-win"
homepage = "https://github.com/abdul-karim-mia/caffeine-win"
keywords = ["caffeine", "windows", "keep-awake", "tray", "utility"]
categories = ["command-line-utilities", "os::windows-apis"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
