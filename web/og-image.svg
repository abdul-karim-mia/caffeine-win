<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="600" cy="200" r="450" fill="url(#glow)" />

  <!-- App Icon Card -->
  <g transform="translate(600, 150)">
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="0" r="42" stroke="#1e293b" stroke-width="4" fill="none" />
    <circle cx="0" cy="0" r="42" stroke="url(#brandGrad)" stroke-width="4" stroke-dasharray="264" stroke-dashoffset="60" stroke-linecap="round" fill="none" />
    <path d="M16 -8h4a10 10 0 0 1 0 20h-4" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <path d="M-22 -8h38v20a10 10 0 0 1-10 10h-18a10 10 0 0 1-10-10Z" fill="url(#brandGrad)" />
    <path d="M-12 -22c0 5-3 5-3 8M-2 -22c0 5-3 5-3 8M8 -22c0 5-3 5-3 8" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="320" font-family="'Segoe UI', -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Caffeine for Windows 11</text>
  <text x="600" y="380" font-family="'Segoe UI', -apple-system, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">Ultra-lightweight (115 KB) System Tray Keep-Awake Utility</text>

  <!-- Feature Pills -->
  <g transform="translate(600, 470)">
    <g transform="translate(-320, 0)">
      <rect x="-100" y="-22" width="200" height="44" rx="22" fill="#1e293b" stroke="#334155" />
      <text x="0" y="6" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ 115 KB Native Exe</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-115" y="-22" width="230" height="44" rx="22" fill="#1e293b" stroke="#334155" />
      <text x="0" y="6" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">⏱️ Live Animated Clock</text>
    </g>
    <g transform="translate(320, 0)">
      <rect x="-100" y="-22" width="200" height="44" rx="22" fill="#1e293b" stroke="#334155" />
      <text x="0" y="6" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">🛡️ Zero Dependencies</text>
    </g>
  </g>

  <text x="600" y="570" font-family="'Segoe UI', sans-serif" font-size="18" fill="#64748b" text-anchor="middle">github.com/abdul-karim-mia/caffeine-win • Open Source under MIT License</text>
</svg>
